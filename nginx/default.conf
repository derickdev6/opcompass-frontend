# nginx serves the built SPA and reverse-proxies the API.
#
# Both behind one origin, which removes CORS from the production path entirely.

upstream opcompass_api {
    # `api` is the backend service name on the shared `opcompass` network.
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # Security headers must be re-included in every block below that sets its
    # own add_header — see the comment in security-headers.conf for why.
    include /etc/nginx/conf.d/security-headers.conf;

    location /api/ {
        proxy_pass http://opcompass_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin and its static files.
    location /admin/ {
        proxy_pass http://opcompass_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://opcompass_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is never cached, otherwise browsers keep loading an old bundle
    # after a deploy.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
