# Security headers, kept in one file because of an nginx inheritance rule that
# is easy to get wrong:
#
#   add_header directives are inherited from the enclosing block ONLY IF the
#   current block defines no add_header of its own.
#
# So a `location` that sets its own Cache-Control silently drops every
# server-level security header. Including this file explicitly in each such
# block is what keeps them present. Verify with:
#
#   curl -I http://localhost/
#
# and confirm Content-Security-Policy is in the response.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# The app has no inline scripts, so script-src stays strict. shadcn components
# set inline style attributes, hence 'unsafe-inline' on style-src only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
