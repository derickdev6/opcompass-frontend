# OP Compass — frontend stack.
#
# Attaches to the same external `opcompass` network as the backend, so nginx
# can reach the API by its service name. Bring the backend up first:
#
#     docker network create opcompass          # once
#     cd ../opcompass-backend && docker compose up -d
#     cd ../opcompass-frontend && docker compose up -d
#
# The app is then on http://<host>/ — nginx serves it and proxies /api.

name: opcompass-frontend

services:
  web:
    build:
      context: .
      args:
        # Relative path: the bundle calls whatever origin served it, which is
        # this same nginx. No hostname is baked into the JavaScript.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - opcompass

networks:
  opcompass:
    external: true
    name: opcompass
